name: Java CI

on:
  - push
  - pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v5
      - run: make lint
      - run: make build
      - name: Coverage summary
        run: |
          python3 - <<'PY'
          import re
          xml = open("build/reports/jacoco/test/jacocoTestReport.xml").read()
          missed, covered = map(int, re.findall(r'counter type="INSTRUCTION" missed="(\d+)" covered="(\d+)"', xml)[-1])
          print(f"Instruction coverage: {covered * 100 / (missed + covered):.1f}%")
          PY
